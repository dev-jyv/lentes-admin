# PROVISIONAL: propuesta del admin para lentes-api. NO es el contrato real.
# Cuando lentes-api publique estos endpoints en api/openapi.yaml, borrar este archivo,
# la carpeta src/app/api/provisional y el desvío en core/api.interceptor.ts.
openapi: 3.0.3
info:
  title: Lentes API - operaciones admin (propuesta)
  version: 0.0.1
paths:
  /v1/admin/orders:
    get:
      operationId: adminListOrders
      tags: [orders]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Pedidos, más recientes primero
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminOrderSummary" }
                  next_cursor: { type: string, nullable: true }
  /v1/admin/orders/{id}:
    get:
      operationId: adminGetOrder
      tags: [orders]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "404":
          description: No encontrado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      operationId: adminUpdateOrder
      tags: [orders]
      description: |
        Transiciones válidas: paid→preparing|cancelled, preparing→shipped|cancelled, shipped→delivered.
        Para pasar a shipped se exigen tracking_carrier y tracking_number. La API es la autoridad (409 si no es válida).
        Reembolsos quedan fuera hasta decidir el flujo con Mercado Pago.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderUpdate" }
      responses:
        "200":
          description: Pedido actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "409":
          description: Transición no permitida
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/admin/prescriptions:
    get:
      operationId: adminListPrescriptions
      tags: [prescriptions]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/RxStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminPrescription" }
  /v1/admin/prescriptions/{id}:
    patch:
      operationId: adminReviewPrescription
      tags: [prescriptions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrescriptionReview" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPrescription" }
        "409":
          description: Ya revisada
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/admin/uploads/image-url:
    post:
      operationId: adminCreateImageUploadUrl
      tags: [images]
      description: URL prefirmada de R2 (PUT directo desde el navegador, 10 min). Solo jpeg, png o webp, máx. 5 MB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, content_type, size_bytes]
              properties:
                product_id: { type: string, format: uuid }
                content_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
                size_bytes: { type: integer, maximum: 5242880 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [upload_url, r2_key]
                properties:
                  upload_url: { type: string }
                  r2_key: { type: string }
  /v1/admin/products/{id}/images:
    get:
      operationId: adminListProductImages
      tags: [images]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Galería en orden (la primera es la principal)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProductImageAdmin" }
    post:
      operationId: adminAddProductImage
      tags: [images]
      description: Registra una imagen ya subida a R2; se agrega al final de la galería.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [r2_key]
              properties:
                r2_key: { type: string }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductImageAdmin" }
  /v1/admin/products/{id}/images/order:
    put:
      operationId: adminReorderProductImages
      tags: [images]
      description: Define el orden completo de la galería.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_ids]
              properties:
                image_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200":
          description: Galería reordenada
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProductImageAdmin" }
  /v1/admin/products/{id}/images/{imageId}:
    delete:
      operationId: adminDeleteProductImage
      tags: [images]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: imageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Eliminada
  /v1/admin/variants/{id}/stock-adjustments:
    get:
      operationId: adminListStockAdjustments
      tags: [inventory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Historial, más reciente primero
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StockAdjustment" }
    post:
      operationId: adminCreateStockAdjustment
      tags: [inventory]
      description: Ajuste de existencia con motivo (bitácora de solo agregar). El stock resultante no puede ser negativo.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockAdjustmentInput" }
      responses:
        "201":
          description: Ajuste registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockAdjustment" }
        "409":
          description: El stock quedaría negativo
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/admin/inventory/low-stock:
    get:
      operationId: adminListLowStock
      tags: [inventory]
      description: Variantes activas con disponible (stock - reserved) menor o igual al umbral.
      parameters:
        - { name: threshold, in: query, schema: { type: integer, minimum: 0, default: 5 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LowStockItem" }
  /v1/admin/reports/sales:
    get:
      operationId: adminSalesReport
      tags: [reports]
      description: Pedidos pagados (paid y posteriores, sin cancelados ni reembolsados) en el rango. Fechas en America/Mexico_City.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesReport" }
  /v1/admin/reports/repurchase:
    get:
      operationId: adminRepurchaseReport
      tags: [reports]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepurchaseReport" }
components:
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    OrderStatus:
      type: string
      enum: [pending_payment, paid, preparing, shipped, delivered, cancelled, refunded, expired]
    AdminOrderSummary:
      type: object
      required: [id, number, status, total_cents, customer_email, created_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64, description: "Folio visible LC-000123" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        total_cents: { type: integer, format: int64 }
        customer_email: { type: string }
        created_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
    OrderLine:
      type: object
      required: [product_name, brand_name, eye, quantity, unit_price_cents, sku]
      properties:
        sku: { type: string }
        product_name: { type: string }
        brand_name: { type: string }
        eye: { type: string, enum: [right, left, both] }
        quantity: { type: integer }
        unit_price_cents: { type: integer, format: int64 }
        description: { type: string, description: "Parámetros al momento de la compra (esfera, cilindro, eje...)" }
    ShippingAddress:
      type: object
      required: [recipient, street, ext_number, neighborhood, city, state, postal_code, phone]
      properties:
        recipient: { type: string }
        street: { type: string }
        ext_number: { type: string }
        int_number: { type: string, nullable: true }
        neighborhood: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }
        phone: { type: string }
    AdminOrder:
      allOf:
        - $ref: "#/components/schemas/AdminOrderSummary"
        - type: object
          required: [items, subtotal_cents, shipping_cents, discount_cents, shipping_address]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/OrderLine" }
            subtotal_cents: { type: integer, format: int64 }
            shipping_cents: { type: integer, format: int64 }
            discount_cents: { type: integer, format: int64 }
            shipping_address: { $ref: "#/components/schemas/ShippingAddress" }
            prescription_id: { type: string, format: uuid, nullable: true }
            mp_payment_id: { type: string, nullable: true }
            tracking_carrier: { type: string, nullable: true }
            tracking_number: { type: string, nullable: true }
            shipped_at: { type: string, format: date-time, nullable: true }
    OrderUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
        tracking_carrier: { type: string }
        tracking_number: { type: string }
    RxStatus:
      type: string
      enum: [pending, approved, rejected]
    AdminPrescription:
      type: object
      required: [id, status, customer_email, od_sphere, os_sphere, issued_at, expires_at, doctor_name, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RxStatus" }
        customer_email: { type: string }
        od_sphere: { type: number }
        od_cylinder: { type: number, nullable: true }
        od_axis: { type: integer, nullable: true }
        od_addition: { type: string, nullable: true }
        os_sphere: { type: number }
        os_cylinder: { type: number, nullable: true }
        os_axis: { type: integer, nullable: true }
        os_addition: { type: string, nullable: true }
        issued_at: { type: string, format: date }
        expires_at: { type: string, format: date }
        doctor_name: { type: string }
        doctor_license: { type: string, nullable: true }
        file_url: { type: string, nullable: true, description: "URL prefirmada de lectura de R2, de corta vida" }
        reject_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    PrescriptionReview:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, rejected] }
        reject_reason: { type: string, description: "Obligatorio al rechazar" }
    ProductImageAdmin:
      type: object
      required: [id, r2_key, url, position]
      properties:
        id: { type: string, format: uuid }
        r2_key: { type: string }
        url: { type: string, description: "URL pública (img.tutienda.com)" }
        position: { type: integer }
    StockReason:
      type: string
      enum: [receipt, count_correction, damage, return, other]
    StockAdjustmentInput:
      type: object
      required: [delta, reason]
      properties:
        delta: { type: integer, description: "Positivo suma, negativo resta; no puede ser 0" }
        reason: { $ref: "#/components/schemas/StockReason" }
        note: { type: string, description: "Obligatoria si reason=other" }
    StockAdjustment:
      type: object
      required: [id, delta, reason, stock_after, created_at, actor_email]
      properties:
        id: { type: string, format: uuid }
        delta: { type: integer }
        reason: { $ref: "#/components/schemas/StockReason" }
        note: { type: string, nullable: true }
        stock_after: { type: integer }
        created_at: { type: string, format: date-time }
        actor_email: { type: string }
    LowStockItem:
      type: object
      required: [variant_id, sku, product_id, product_name, brand_name, stock, reserved, available]
      properties:
        variant_id: { type: string, format: uuid }
        sku: { type: string }
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        brand_name: { type: string }
        stock: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
    SalesReport:
      type: object
      required: [orders, revenue_cents, units, daily, top_products]
      properties:
        orders: { type: integer }
        revenue_cents: { type: integer, format: int64 }
        units: { type: integer, description: "Cajas vendidas" }
        daily:
          type: array
          items:
            type: object
            required: [date, orders, revenue_cents]
            properties:
              date: { type: string, format: date }
              orders: { type: integer }
              revenue_cents: { type: integer, format: int64 }
        top_products:
          type: array
          items:
            type: object
            required: [product_name, brand_name, units, revenue_cents]
            properties:
              product_name: { type: string }
              brand_name: { type: string }
              units: { type: integer }
              revenue_cents: { type: integer, format: int64 }
    RepurchaseReport:
      type: object
      required: [customers, repeat_customers, reminders_sent, reorders_from_reminder]
      properties:
        customers: { type: integer, description: "Clientes con al menos un pedido pagado en el rango" }
        repeat_customers: { type: integer, description: "De ellos, los que ya habían comprado antes" }
        reminders_sent: { type: integer }
        reorders_from_reminder: { type: integer, description: "Pedidos pagados que vinieron del enlace de recordatorio" }
