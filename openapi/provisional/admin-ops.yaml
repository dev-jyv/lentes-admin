# PROVISIONAL: propuesta del admin para lentes-api. NO es el contrato real.
# Cuando lentes-api publique estos endpoints en api/openapi.yaml, borrar este archivo,
# la carpeta src/app/api/provisional y el desvío en core/api.interceptor.ts.
openapi: 3.0.3
info:
  title: Lentes API - operaciones admin (propuesta)
  version: 0.0.1
paths:
  /v1/admin/variants/{id}/stock-adjustments:
    get:
      operationId: adminListStockAdjustments
      tags: [inventory]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Historial, más reciente primero
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/StockAdjustment" }
    post:
      operationId: adminCreateStockAdjustment
      tags: [inventory]
      description: Ajuste de existencia con motivo (bitácora de solo agregar). El stock resultante no puede ser negativo.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StockAdjustmentInput" }
      responses:
        "201":
          description: Ajuste registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StockAdjustment" }
        "409":
          description: El stock quedaría negativo
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/admin/inventory/low-stock:
    get:
      operationId: adminListLowStock
      tags: [inventory]
      description: Variantes activas con disponible (stock - reserved) menor o igual al umbral.
      parameters:
        - { name: threshold, in: query, schema: { type: integer, minimum: 0, default: 5 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LowStockItem" }
  /v1/admin/reports/sales:
    get:
      operationId: adminSalesReport
      tags: [reports]
      description: Pedidos pagados (paid y posteriores, sin cancelados ni reembolsados) en el rango. Fechas en America/Mexico_City.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesReport" }
  /v1/admin/reports/repurchase:
    get:
      operationId: adminRepurchaseReport
      tags: [reports]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepurchaseReport" }
components:
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    StockReason:
      type: string
      enum: [receipt, count_correction, damage, return, other]
    StockAdjustmentInput:
      type: object
      required: [delta, reason]
      properties:
        delta: { type: integer, description: "Positivo suma, negativo resta; no puede ser 0" }
        reason: { $ref: "#/components/schemas/StockReason" }
        note: { type: string, description: "Obligatoria si reason=other" }
    StockAdjustment:
      type: object
      required: [id, delta, reason, stock_after, created_at, actor_email]
      properties:
        id: { type: string, format: uuid }
        delta: { type: integer }
        reason: { $ref: "#/components/schemas/StockReason" }
        note: { type: string, nullable: true }
        stock_after: { type: integer }
        created_at: { type: string, format: date-time }
        actor_email: { type: string }
    LowStockItem:
      type: object
      required: [variant_id, sku, product_id, product_name, brand_name, stock, reserved, available]
      properties:
        variant_id: { type: string, format: uuid }
        sku: { type: string }
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        brand_name: { type: string }
        stock: { type: integer }
        reserved: { type: integer }
        available: { type: integer }
    SalesReport:
      type: object
      required: [orders, revenue_cents, units, daily, top_products]
      properties:
        orders: { type: integer }
        revenue_cents: { type: integer, format: int64 }
        units: { type: integer, description: "Cajas vendidas" }
        daily:
          type: array
          items:
            type: object
            required: [date, orders, revenue_cents]
            properties:
              date: { type: string, format: date }
              orders: { type: integer }
              revenue_cents: { type: integer, format: int64 }
        top_products:
          type: array
          items:
            type: object
            required: [product_name, brand_name, units, revenue_cents]
            properties:
              product_name: { type: string }
              brand_name: { type: string }
              units: { type: integer }
              revenue_cents: { type: integer, format: int64 }
    RepurchaseReport:
      type: object
      required: [customers, repeat_customers, reminders_sent, reorders_from_reminder]
      properties:
        customers: { type: integer, description: "Clientes con al menos un pedido pagado en el rango" }
        repeat_customers: { type: integer, description: "De ellos, los que ya habían comprado antes" }
        reminders_sent: { type: integer }
        reorders_from_reminder: { type: integer, description: "Pedidos pagados que vinieron del enlace de recordatorio" }
