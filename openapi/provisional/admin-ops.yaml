# PROVISIONAL: propuesta del admin para lentes-api. NO es el contrato real.
# Cuando lentes-api publique estos endpoints en api/openapi.yaml, borrar este archivo,
# la carpeta src/app/api/provisional y el desvío en core/api.interceptor.ts.
openapi: 3.0.3
info:
  title: Lentes API - operaciones admin (propuesta)
  version: 0.0.1
paths:
  /v1/admin/orders:
    get:
      operationId: adminListOrders
      tags: [orders]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/OrderStatus" } }
        - { name: cursor, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Pedidos, más recientes primero
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminOrderSummary" }
                  next_cursor: { type: string, nullable: true }
  /v1/admin/orders/{id}:
    get:
      operationId: adminGetOrder
      tags: [orders]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "404":
          description: No encontrado
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    patch:
      operationId: adminUpdateOrder
      tags: [orders]
      description: |
        Transiciones válidas: paid→preparing|cancelled, preparing→shipped|cancelled, shipped→delivered.
        Para pasar a shipped se exigen tracking_carrier y tracking_number. La API es la autoridad (409 si no es válida).
        Reembolsos quedan fuera hasta decidir el flujo con Mercado Pago.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderUpdate" }
      responses:
        "200":
          description: Pedido actualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminOrder" }
        "409":
          description: Transición no permitida
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /v1/admin/prescriptions:
    get:
      operationId: adminListPrescriptions
      tags: [prescriptions]
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/RxStatus" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminPrescription" }
  /v1/admin/prescriptions/{id}:
    patch:
      operationId: adminReviewPrescription
      tags: [prescriptions]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PrescriptionReview" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPrescription" }
        "409":
          description: Ya revisada
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    OrderStatus:
      type: string
      enum: [pending_payment, paid, preparing, shipped, delivered, cancelled, refunded, expired]
    AdminOrderSummary:
      type: object
      required: [id, number, status, total_cents, customer_email, created_at]
      properties:
        id: { type: string, format: uuid }
        number: { type: integer, format: int64, description: "Folio visible LC-000123" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        total_cents: { type: integer, format: int64 }
        customer_email: { type: string }
        created_at: { type: string, format: date-time }
        paid_at: { type: string, format: date-time, nullable: true }
    OrderLine:
      type: object
      required: [product_name, brand_name, eye, quantity, unit_price_cents, sku]
      properties:
        sku: { type: string }
        product_name: { type: string }
        brand_name: { type: string }
        eye: { type: string, enum: [right, left, both] }
        quantity: { type: integer }
        unit_price_cents: { type: integer, format: int64 }
        description: { type: string, description: "Parámetros al momento de la compra (esfera, cilindro, eje...)" }
    ShippingAddress:
      type: object
      required: [recipient, street, ext_number, neighborhood, city, state, postal_code, phone]
      properties:
        recipient: { type: string }
        street: { type: string }
        ext_number: { type: string }
        int_number: { type: string, nullable: true }
        neighborhood: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }
        phone: { type: string }
    AdminOrder:
      allOf:
        - $ref: "#/components/schemas/AdminOrderSummary"
        - type: object
          required: [items, subtotal_cents, shipping_cents, discount_cents, shipping_address]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/OrderLine" }
            subtotal_cents: { type: integer, format: int64 }
            shipping_cents: { type: integer, format: int64 }
            discount_cents: { type: integer, format: int64 }
            shipping_address: { $ref: "#/components/schemas/ShippingAddress" }
            prescription_id: { type: string, format: uuid, nullable: true }
            mp_payment_id: { type: string, nullable: true }
            tracking_carrier: { type: string, nullable: true }
            tracking_number: { type: string, nullable: true }
            shipped_at: { type: string, format: date-time, nullable: true }
    OrderUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
        tracking_carrier: { type: string }
        tracking_number: { type: string }
    RxStatus:
      type: string
      enum: [pending, approved, rejected]
    AdminPrescription:
      type: object
      required: [id, status, customer_email, od_sphere, os_sphere, issued_at, expires_at, doctor_name, created_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RxStatus" }
        customer_email: { type: string }
        od_sphere: { type: number }
        od_cylinder: { type: number, nullable: true }
        od_axis: { type: integer, nullable: true }
        od_addition: { type: string, nullable: true }
        os_sphere: { type: number }
        os_cylinder: { type: number, nullable: true }
        os_axis: { type: integer, nullable: true }
        os_addition: { type: string, nullable: true }
        issued_at: { type: string, format: date }
        expires_at: { type: string, format: date }
        doctor_name: { type: string }
        doctor_license: { type: string, nullable: true }
        file_url: { type: string, nullable: true, description: "URL prefirmada de lectura de R2, de corta vida" }
        reject_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    PrescriptionReview:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [approved, rejected] }
        reject_reason: { type: string, description: "Obligatorio al rechazar" }
