# PROVISIONAL: propuesta del admin para lentes-api. NO es el contrato real.
# Cuando lentes-api publique estos endpoints en api/openapi.yaml, borrar este archivo,
# la carpeta src/app/api/provisional y el desvío en core/api.interceptor.ts.
openapi: 3.0.3
info:
  title: Lentes API - operaciones admin (propuesta)
  version: 0.0.1
paths:
  /v1/admin/reports/sales:
    get:
      operationId: adminSalesReport
      tags: [reports]
      description: Pedidos pagados (paid y posteriores, sin cancelados ni reembolsados) en el rango. Fechas en America/Mexico_City.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SalesReport" }
  /v1/admin/reports/repurchase:
    get:
      operationId: adminRepurchaseReport
      tags: [reports]
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RepurchaseReport" }
components:
  schemas:
    Problem:
      type: object
      required: [title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    SalesReport:
      type: object
      required: [orders, revenue_cents, units, daily, top_products]
      properties:
        orders: { type: integer }
        revenue_cents: { type: integer, format: int64 }
        units: { type: integer, description: "Cajas vendidas" }
        daily:
          type: array
          items:
            type: object
            required: [date, orders, revenue_cents]
            properties:
              date: { type: string, format: date }
              orders: { type: integer }
              revenue_cents: { type: integer, format: int64 }
        top_products:
          type: array
          items:
            type: object
            required: [product_name, brand_name, units, revenue_cents]
            properties:
              product_name: { type: string }
              brand_name: { type: string }
              units: { type: integer }
              revenue_cents: { type: integer, format: int64 }
    RepurchaseReport:
      type: object
      required: [customers, repeat_customers, reminders_sent, reorders_from_reminder]
      properties:
        customers: { type: integer, description: "Clientes con al menos un pedido pagado en el rango" }
        repeat_customers: { type: integer, description: "De ellos, los que ya habían comprado antes" }
        reminders_sent: { type: integer }
        reorders_from_reminder: { type: integer, description: "Pedidos pagados que vinieron del enlace de recordatorio" }
